services: # Backend API Service
   backend:
      build:
         context: ./Backend
         dockerfile: Dockerfile.dev
      container_name: opennezt-backend
      restart: unless-stopped
      environment:
         NODE_ENV: ${NODE_ENV:-development}
         PORT: 3456
         HOST: 0.0.0.0
         # MongoDB Atlas Configuration
         DB_NAME: ${DB_NAME}
         DB_USERNAME: ${DB_USERNAME}
         DB_PASSWORD: ${DB_PASSWORD}
         DB_USER: ${DB_USER}
         DB_AUTH_SOURCE: ${DB_AUTH_SOURCE}
         # App Config
         APP_NAME: ${APP_NAME}
         APP_URL_API: ${APP_URL_API}
         APP_URL_CLIENT: ${APP_URL_CLIENT}
         OTHER_URLS_CLIENT: ${OTHER_URLS_CLIENT}
         APP_URL_AUTH: ${APP_URL_AUTH}
         SECRET_KEY: ${SECRET_KEY}
         LOGIN_EXPIRE_IN: ${LOGIN_EXPIRE_IN}
         VERIFY_EMAIL_EXPIRE_IN: ${VERIFY_EMAIL_EXPIRE_IN}
         REQUESTS_LIMIT_PER_MINUTE: ${REQUESTS_LIMIT_PER_MINUTE}
         # Mail (Optional)
         MAIL_HOST: ${MAIL_HOST}
         MAIL_PORT: ${MAIL_PORT}
         MAIL_SECURE: ${MAIL_SECURE}
         MAIL_USERNAME: ${MAIL_USERNAME}
         MAIL_PASSWORD: ${MAIL_PASSWORD}
         MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
         MAIL_FROM_NAME: ${MAIL_FROM_NAME}
         MAIL_TO: ${MAIL_TO}
         VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
         VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
         # External APIs (Optional)
         OPENAI_API_KEY: ${OPENAI_API_KEY}
         OPENAI_API_URL: ${OPENAI_API_URL}
         OPENAI_API_SPEECH_URL: ${OPENAI_API_SPEECH_URL}
         LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
         LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
         GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
         GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
         AI_API_URL: ${AI_API_URL}
         AI_API_TOKEN: ${AI_API_TOKEN}
      ports:
         - "3456:3456"
         - "9229:9229" # Debug port
      volumes:
         - backend_logs:/app/private/logs
         - backend_uploads:/app/public/uploads
      networks:
         - opennezt-network
      healthcheck:
         test: ["CMD", "curl", "-f", "http://localhost:3456/"]
         interval: 30s
         timeout: 10s
         retries: 5
         start_period: 60s

   # Frontend Service (Optional - can be run separately)
   frontend:
      build:
         context: ./Frontend
         # dockerfile: Dockerfile #Production build
         dockerfile: Dockerfile.dev # Development build
      container_name: opennezt-frontend
      restart: unless-stopped
      environment:
         NGINX_HOST: 0.0.0.0
         NGINX_PORT: 3000
      ports:
         - "3000:3000"
      depends_on:
         backend:
            condition: service_healthy
      networks:
         - opennezt-network
      healthcheck:
         test: ["CMD", "curl", "-f", "http://localhost:3000/"]
         interval: 30s
         timeout: 10s
         retries: 5
         start_period: 30s

   # Redis Service (for caching)
   redis:
      image: redis:7.2-alpine
      container_name: opennezt-redis
      restart: unless-stopped
      ports:
         - "6379:6379"
      command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
      volumes:
         - redis_data:/data
      networks:
         - opennezt-network
      healthcheck:
         test: ["CMD", "redis-cli", "ping"]
         interval: 30s
         timeout: 10s
         retries: 3

volumes:
   redis_data:
      driver: local
   backend_uploads:
      driver: local
   backend_logs:
      driver: local

networks:
   opennezt-network:
      driver: bridge
      ipam:
         config:
            - subnet: 172.20.0.0/16
